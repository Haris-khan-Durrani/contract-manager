version: '3.8'

services:
  # ─── MySQL 8+ ──────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: contractmanager_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-contractmanager}
      MYSQL_USER: ${DB_USER:-cmuser}
      MYSQL_PASSWORD: ${DB_PASSWORD:-rootpassword}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./server/src/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ─── Node.js Backend ───────────────────────────────────────────────────────
  server:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    container_name: contractmanager_server
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    env_file: .env
    environment:
      DB_HOST: mysql
    ports:
      - "${PORT:-3001}:3001"
    volumes:
      - ./server:/app
      - /app/node_modules
    command: npm run dev

  # ─── Vue 3 Frontend ────────────────────────────────────────────────────────
  client:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    container_name: contractmanager_client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - /app/node_modules
    command: npm run dev -- --host

volumes:
  mysql_data:
    driver: local
